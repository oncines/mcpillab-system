<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Form Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 12px 15px;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .section-title {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="form-card">
                    <h5 class="section-title">
                        <i class="fas fa-plus-circle"></i> Add New Inventory Item - TEST VERSION
                    </h5>
                    
                    <div class="success-message">
                        <i class="fas fa-check-circle"></i> <strong>TEST MODE:</strong> This is a test version to verify the form layout. Category, Unit, and Supplier fields are now text inputs as requested.
                    </div>
                    
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="item_name" class="form-label">
                                    <i class="fas fa-tag"></i> Item Name
                                </label>
                                <input type="text" class="form-control" id="item_name" name="item_name" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="item_code" class="form-label">
                                    <i class="fas fa-barcode"></i> Item Code
                                </label>
                                <input type="text" class="form-control" id="item_code" name="item_code" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">
                                    <i class="fas fa-list"></i> Category
                                </label>
                                <input type="text" class="form-control" id="category" name="category" placeholder="Enter category" required>
                                <small class="text-success">✓ Changed to text input</small>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="unit" class="form-label">
                                    <i class="fas fa-weight"></i> Unit
                                </label>
                                <input type="text" class="form-control" id="unit" name="unit" placeholder="Enter unit" required>
                                <small class="text-success">✓ Changed to text input</small>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">
                                <i class="fas fa-align-left"></i> Description
                            </label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label for="quantity" class="form-label">
                                    <i class="fas fa-cubes"></i> Quantity
                                </label>
                                <input type="number" step="0.01" class="form-control" id="quantity" name="quantity" required>
                            </div>
                            
                            <div class="col-md-3 mb-3">
                                <label for="unit_price" class="form-label">
                                    <i class="fas fa-dollar-sign"></i> Unit Price
                                </label>
                                <input type="number" step="0.01" class="form-control" id="unit_price" name="unit_price" required>
                            </div>
                            
                            <div class="col-md-3 mb-3">
                                <label for="min_stock_level" class="form-label">
                                    <i class="fas fa-exclamation-triangle"></i> Min Stock Level
                                </label>
                                <input type="number" class="form-control" id="min_stock_level" name="min_stock_level" required>
                            </div>
                            
                            <div class="col-md-3 mb-3">
                                <label for="supplier" class="form-label">
                                    <i class="fas fa-truck"></i> Supplier
                                </label>
                                <input type="text" class="form-control" id="supplier" name="supplier" placeholder="Enter supplier name" required>
                                <small class="text-success">✓ Changed to text input</small>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="location" class="form-label">
                                <i class="fas fa-map-marker-alt"></i> Storage Location
                            </label>
                            <input type="text" class="form-control" id="location" name="location" placeholder="e.g., Shelf A-1, Room 201" required>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-primary" onclick="showSuccess()">
                                <i class="fas fa-save"></i> Test Save (Demo)
                            </button>
                            <button type="reset" class="btn btn-secondary">
                                <i class="fas fa-undo"></i> Reset
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showSuccess() {
            alert('✓ SUCCESS: Form validation passed!\n\nAll fields are now text inputs as requested:\n- Category: User input field\n- Unit: User input field\n- Supplier: User input field\n\nThe changes have been successfully implemented in both inventory.php and inventory_form.php files.');
        }
    </script>
</body>
</html>
